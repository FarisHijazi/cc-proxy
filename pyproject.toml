[project]
name = "cc-proxy"
version = "0.4.0"
description = "Claude Code on several Claude accounts plus Codex and Cursor, through one shared proxy with quota fallback"
authors = [
    { name = "Faris Hijazi", email = "theefaris@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mitmproxy>=12.2,<13",
    "claude-swap @ git+https://github.com/FarisHijazi/claude-swap",
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
# claude_rc: read claude.ai cookies from local Chrome / over CDP (claude_rc.webauth).
web = ["browser-cookie3>=0.19", "websockets>=12"]

[project.scripts]
cc-proxy = "cc_proxy.cli:main"
cc-proxy-traffic = "cc_proxy.cli:traffic"
cc-proxy-ui = "cc_proxy.cli:ui"
claude-account-router = "cc_proxy.cli:main"
claude-accounts = "cc_proxy.cli:accounts"
claude-rc = "claude_rc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["python/cc_proxy", "python/claude_rc"]

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "cc_proxy/scripts"

[tool.hatch.build.targets.sdist]
only-include = ["python", "scripts", "pyproject.toml", "LICENSE", "README.md"]
