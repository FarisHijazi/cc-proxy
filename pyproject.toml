[project]
name = "cc-proxy"
version = "0.4.0"
description = "Claude Code on several Claude accounts plus Codex and Cursor, through one shared proxy with quota fallback"
authors = [
    { name = "Faris Hijazi", email = "theefaris@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mitmproxy>=12.2,<13",
    "claude-swap @ git+https://github.com/FarisHijazi/claude-swap",
]

[project.optional-dependencies]
sessions = ["httpx==0.28.1"]
sessions-mcp = ["httpx==0.28.1", "httpx2==2.16.0", "mcp==2.3.0"]
acp = ["httpx==0.28.1", "httpx2==2.16.0", "mcp==2.3.0", "agent-client-protocol==1.0.0"]
affinity = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
cc-proxy = "cc_proxy.cli:main"
cc-proxy-traffic = "cc_proxy.cli:traffic"
cc-proxy-ui = "cc_proxy.cli:ui"
claude-account-router = "cc_proxy.cli:main"
claude-accounts = "cc_proxy.cli:accounts"
claude-model-picker = "cc_proxy.cli:model_picker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["python/cc_proxy"]
only-include = ["python/cc_proxy", "scripts"]
exclude = [
  "scripts/session-mod/.claude-plugin/types/**",
  "scripts/session-mod/tsconfig.json",
  "scripts/session-mod/node_modules/**",
]

# Normal source selection honors excludes; force-include bypasses them.
[tool.hatch.build.targets.wheel.sources]
"scripts" = "cc_proxy/scripts"

[tool.hatch.build.targets.sdist]
only-include = ["python", "scripts", "pyproject.toml", "LICENSE", "README.md"]
