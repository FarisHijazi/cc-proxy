name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Full checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        run: cargo install checkle just --locked
      - name: Run full checks
        run: just check-ci

  fleet-checks:
    name: Fleet MCP and ACP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Test fleet adapters without production credentials
        run: >-
          uv run --no-project
          --with agent-client-protocol==1.0.0 --with mcp==2.3.0
          --with httpx==0.28.1 --with httpx2==2.16.0 --with pytest
          pytest -q tests/account_acp_test.py tests/account_acp_transport_test.py
          tests/fleet_acp_live_test.py tests/account_mcp_relay_test.py
          tests/session_client_test.py
      - name: Test native session routing in the proxy dependency environment
        run: >-
          uv run --no-project --with mitmproxy==12.2.1 --with prometheus-client==0.21.1 --with pytest
          pytest -q tests/account_remote_links_test.py tests/account_remote_route_test.py
          tests/session_mod_launcher_test.py tests/account_traffic_test.py
          tests/claude_model_picker_test.py tests/account_insights_test.py tests/account_metrics_test.py
      - name: Lint fleet adapters
        run: >-
          uvx ruff check scripts/cc-proxy-acp scripts/account_mcp_relay.py
          tests/account_acp_test.py tests/account_acp_transport_test.py
          tests/fleet_acp_live_test.py tests/account_mcp_relay_test.py
          python/cc_proxy/session_client.py scripts/account_remote_links.py
          tests/session_client_test.py tests/account_remote_links_test.py
          scripts/account_remote_route.py scripts/claude-account-router
          scripts/account_traffic.py tests/account_traffic_test.py
          tests/account_remote_route_test.py tests/session_mod_launcher_test.py
          scripts/claude-model-picker tests/claude_model_picker_test.py
          scripts/account_insights.py tests/account_insights_test.py
          scripts/account_metrics.py tests/account_metrics_test.py
